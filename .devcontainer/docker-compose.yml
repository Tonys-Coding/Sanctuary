# Two containers: the workspace (Node) and PostgreSQL.
# The workspace shares the database container's network, so the app reaches it at localhost:5432.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sanctuary
      POSTGRES_PASSWORD: sanctuary
      POSTGRES_DB: sanctuary
    volumes:
      # Keeps the data when the codespace is stopped; it is deleted with the codespace.
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
